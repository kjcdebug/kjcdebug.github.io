<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found</title>
<style>
  :root { --bg:#ffffff; --text:#383837; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151515; --text:#f2f2f2; } }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family: Arial, Helvetica, sans-serif; }
  main { max-width:460px; margin:0 auto; padding:48px 16px; text-align:center; font-size:17px; }
</style>
<script>
  // Daily Log links whose "#" got encoded as "%23" land here as a missing page.
  // If the address holds a Daily Log code, send it to the Daily Log page the normal way.
  (function () {
    var m = decodeURIComponent(location.pathname + location.search + location.hash).match(/d1\.[A-Za-z0-9_-]+/);
    if (m) location.replace("/daily-log/#" + m[0]);
  })();
</script>
</head>
<body>
<main><p>Page not found.</p></main>
</body>
</html>
